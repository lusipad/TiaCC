name: TiaCC Self-Testing (Dogfooding)

on:
  push:
    branches: [ main, develop, "claude/*" ]
    paths:
      - 'tools-dotnet/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'tools-dotnet/**'

jobs:
  # Job 1: .NET 全量测试，构建映射数据库
  dotnet-build-map:
    name: Build .NET Test Impact Map
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 10 (Daily)
        run: |
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --quality daily
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV
          echo "$HOME/.dotnet" >> $GITHUB_PATH

      - name: Restore dependencies
        working-directory: tools-dotnet
        run: dotnet restore

      - name: Build impact map (dogfooding)
        working-directory: tools-dotnet
        run: bash scripts/build-self-test-map.sh

      - name: Upload .NET impact map as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiacc-dotnet-impact-map
          path: tools-dotnet/tiacc-data/impact_map.db
          retention-days: 30

  # Job 2: .NET PR 智能测试选择
  dotnet-smart-test:
    name: .NET Smart Test Selection (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 10 (Daily)
        run: |
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --quality daily
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV
          echo "$HOME/.dotnet" >> $GITHUB_PATH

      - name: Restore and build
        working-directory: tools-dotnet
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Detect changed files
        id: changed-files
        working-directory: tools-dotnet
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "Changed files in this PR:"
          cat changed_files.txt

          # Filter for .cs files in tools-dotnet
          grep '^tools-dotnet/.*\.cs$' changed_files.txt > changed_cs_files.txt || true

          if [ -s changed_cs_files.txt ]; then
            echo "Found changed .NET source files:"
            cat changed_cs_files.txt
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No .NET source files changed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Download previous .NET impact map
        if: steps.changed-files.outputs.has_changes == 'true'
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          workflow: tiacc-self-test.yml
          name: tiacc-dotnet-impact-map
          path: tools-dotnet/tiacc-data
          search_artifacts: true

      - name: Get affected tests
        id: affected-tests
        if: steps.changed-files.outputs.has_changes == 'true'
        working-directory: tools-dotnet
        run: |
          if [ -f "tiacc-data/impact_map.db" ]; then
            echo "Found .NET impact map, querying affected tests..."

            # Get relative paths of changed files
            CHANGED_FILES=$(cat changed_cs_files.txt | sed 's|^tools-dotnet/||' | tr '\n' ' ')

            AFFECTED=$(dotnet run --project TiaCC.Cli/TiaCC.Cli.csproj -- query \
              --db tiacc-data/impact_map.db \
              --files $CHANGED_FILES 2>/dev/null || echo "")

            if [ -n "$AFFECTED" ] && [ "$AFFECTED" != "No affected tests found." ]; then
              echo "Affected tests:"
              echo "$AFFECTED"
              echo "test_filter=$AFFECTED" >> $GITHUB_OUTPUT
              echo "run_mode=smart" >> $GITHUB_OUTPUT
            else
              echo "No affected tests found, running all tests"
              echo "run_mode=all" >> $GITHUB_OUTPUT
            fi
          else
            echo ".NET impact map not found, running all tests"
            echo "run_mode=all" >> $GITHUB_OUTPUT
          fi

      - name: Run .NET tests
        working-directory: tools-dotnet
        run: |
          if [ "${{ steps.affected-tests.outputs.run_mode }}" == "smart" ]; then
            echo "Running ONLY affected .NET tests..."
            FILTER="${{ steps.affected-tests.outputs.test_filter }}"
            # Convert space-separated list to filter expression
            FILTER_EXPR=$(echo "$FILTER" | tr ' ' '\n' | sed 's/.*/FullyQualifiedName~&/' | tr '\n' '|' | sed 's/|$//')
            dotnet test TiaCC.Core.Tests/TiaCC.Core.Tests.csproj --no-build -c Release --filter "$FILTER_EXPR"
          else
            echo "Running ALL .NET tests..."
            dotnet test TiaCC.Core.Tests/TiaCC.Core.Tests.csproj --no-build -c Release
          fi

  # Job 3: 代码覆盖率检查（不阻断）
  dotnet-coverage-gate:
    name: .NET Coverage Check (Non-blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 10 (Daily)
        run: |
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --quality daily
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV
          echo "$HOME/.dotnet" >> $GITHUB_PATH

      - name: Restore and build
        working-directory: tools-dotnet
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Run tests with coverage (Cobertura)
        working-directory: tools-dotnet
        run: |
          rm -rf tiacc-data/coverage-gate
          mkdir -p tiacc-data/coverage-gate

          dotnet test TiaCC.Core.Tests/TiaCC.Core.Tests.csproj \
            --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory tiacc-data/coverage-gate \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

          COVERAGE_FILE=$(find tiacc-data/coverage-gate -name "coverage.cobertura.xml" -type f | head -1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "Coverage file not found"
            exit 1
          fi

          python3 - <<PY
import sys
import xml.etree.ElementTree as ET

path = "$COVERAGE_FILE"
threshold = 0.90

root = ET.parse(path).getroot()
line_rate = float(root.attrib.get("line-rate", "0"))
branch_rate = float(root.attrib.get("branch-rate", "0"))

print(f"Coverage (line-rate):   {line_rate*100:.2f}%")
print(f"Coverage (branch-rate): {branch_rate*100:.2f}%")
print(f"Threshold (line-rate):  {threshold*100:.0f}%")

if line_rate < threshold:
    print(f"::warning title=Coverage below threshold::line-rate {line_rate*100:.2f}% is below {threshold*100:.0f}% (non-blocking)")
PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiacc-dotnet-coverage
          path: tools-dotnet/tiacc-data/coverage-gate/
          retention-days: 7

  # Job 4: 验证 .NET dogfooding 脚本
  dotnet-verify-demo:
    name: Verify .NET Dogfooding Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 10 (Daily)
        run: |
          wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --quality daily
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV
          echo "$HOME/.dotnet" >> $GITHUB_PATH

      - name: Run .NET dogfooding script
        working-directory: tools-dotnet
        run: bash scripts/build-self-test-map.sh

      - name: Upload .NET demo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiacc-dotnet-dogfooding-demo
          path: tools-dotnet/tiacc-data/
          retention-days: 7
