# TiaCC GitLab CI Template
# Include this in your .gitlab-ci.yml to enable Test Impact Analysis
#
# Usage:
#   include:
#     - remote: 'https://raw.githubusercontent.com/lusipad/TiaCC/main/ci-templates/gitlab-ci.yml'
#
#   stages:
#     - test
#
#   unit-tests:
#     extends: .tiacc-test
#     script:
#       - dotnet test --filter "$TIACC_TEST_FILTER"

# Variables (can be overridden in your .gitlab-ci.yml)
variables:
  TIACC_DATABASE: "impact_map.db"
  TIACC_COVERAGE_DIR: "./coverage"
  TIACC_BASE_BRANCH: "origin/main"
  TIACC_VERBOSE: "false"
  DOTNET_VERSION: "10.0"

# Cache the database between runs
.tiacc-cache:
  cache:
    key: tiacc-database
    paths:
      - $TIACC_DATABASE
    policy: pull-push

# Build job - run nightly to update mappings
.tiacc-build:
  extends: .tiacc-cache
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}
  stage: .pre
  script:
    - dotnet build src/TiaCC.DotNet.sln -c Release
    - |
      dotnet run --project src/cli/dotnet/TiaCC.Cli/TiaCC.Cli.csproj -- init --db $TIACC_DATABASE  

      # Map coverage files
      for coverage_file in $TIACC_COVERAGE_DIR/**/coverage.cobertura.xml; do
        if [ -f "$coverage_file" ]; then
          TEST_NAME=$(basename $(dirname "$coverage_file"))
          echo "Mapping coverage for $TEST_NAME..."
          dotnet run --project src/cli/dotnet/TiaCC.Cli/TiaCC.Cli.csproj -- map \
            --db $TIACC_DATABASE \
            --coverage "$coverage_file" \
            --test "$TEST_NAME" || true
        fi
      done

      # Show statistics
      dotnet run --project src/cli/dotnet/TiaCC.Cli/TiaCC.Cli.csproj -- stats --db $TIACC_DATABASE
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# Recommend job - run on MRs to get affected tests
.tiacc-recommend:
  extends: .tiacc-cache
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}
  stage: .pre
  cache:
    policy: pull
  script:
    - |
      # Check if database exists
      if [ ! -f "$TIACC_DATABASE" ]; then
        echo "No TiaCC database found. Running all tests."
        echo "" > affected-tests.txt
        exit 0
      fi

      # Build TiaCC
      dotnet build src/TiaCC.DotNet.sln -c Release

      # Get changed files
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        CHANGED_FILES=$(git diff --name-only origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME)
      else
        CHANGED_FILES=$(git diff --name-only $TIACC_BASE_BRANCH)
      fi

      # Query affected tests
      dotnet run --project src/cli/dotnet/TiaCC.Cli/TiaCC.Cli.csproj -- query \
        --db $TIACC_DATABASE \
        --files $CHANGED_FILES > affected-tests.txt || true

      # Output results
      echo "=== TiaCC Test Impact Analysis ==="
      echo "Affected tests:"
      cat affected-tests.txt
      echo "=================================="

      # Set for downstream jobs
      AFFECTED_COUNT=$(wc -l < affected-tests.txt | tr -d ' ')
      echo "TIACC_AFFECTED_COUNT=$AFFECTED_COUNT" >> build.env
  artifacts:
    paths:
      - affected-tests.txt
    reports:
      dotenv: build.env
    expire_in: 1 day
  rules:
    - if: $CI_MERGE_REQUEST_ID

# Test job template - use affected tests
.tiacc-test:
  needs:
    - job: tiacc-recommend
      optional: true
  before_script:
    - |
      # Read affected tests if available
      if [ -f "affected-tests.txt" ] && [ -s "affected-tests.txt" ]; then
        export TIACC_TEST_FILTER=$(cat affected-tests.txt | tr '\n' '|' | sed 's/|$//')
        echo "Running affected tests: $TIACC_TEST_FILTER"
      else
        echo "Running all tests (no TiaCC filter)"
        export TIACC_TEST_FILTER=""
      fi

# Complete workflow example
tiacc-build:
  extends: .tiacc-build

tiacc-recommend:
  extends: .tiacc-recommend

