# TiaCC GitLab CI Template
# Include this in your .gitlab-ci.yml to enable Test Impact Analysis
#
# Usage:
#   include:
#     - remote: 'https://raw.githubusercontent.com/your-org/TiaCC/main/ci-templates/gitlab-ci.yml'
#
#   stages:
#     - test
#
#   unit-tests:
#     extends: .tiacc-test
#     script:
#       - npm test -- $TIACC_TEST_FILTER

# Variables (can be overridden in your .gitlab-ci.yml)
variables:
  TIACC_VERSION: "latest"
  TIACC_DATABASE: "impact_map.db"
  TIACC_COVERAGE_DIR: "./coverage"
  TIACC_FORMAT: "auto"
  TIACC_BASE_BRANCH: "origin/main"
  TIACC_VERBOSE: "false"

# Cache the database between runs
.tiacc-cache:
  cache:
    key: tiacc-database
    paths:
      - $TIACC_DATABASE
    policy: pull-push

# Build job - run nightly to update mappings
.tiacc-build:
  extends: .tiacc-cache
  image: node:20
  stage: .pre
  script:
    - npm install -g @tiacc/tools
    - |
      ARGS="build -c $TIACC_COVERAGE_DIR -d $TIACC_DATABASE"

      # Add format flags
      case "$TIACC_FORMAT" in
        lcov) ARGS="$ARGS --lcov" ;;
        jacoco) ARGS="$ARGS --jacoco" ;;
        istanbul) ARGS="$ARGS --istanbul" ;;
        coveragepy) ARGS="$ARGS --coveragepy" ;;
        dotcover) ARGS="$ARGS --dotcover" ;;
        opencppcoverage) ARGS="$ARGS --opencppcoverage" ;;
        auto)
          # Auto-detect formats
          if ls $TIACC_COVERAGE_DIR/*.info 2>/dev/null; then ARGS="$ARGS --lcov"; fi
          if ls $TIACC_COVERAGE_DIR/*jacoco*.xml 2>/dev/null; then ARGS="$ARGS --jacoco"; fi
          if ls $TIACC_COVERAGE_DIR/coverage-final.json 2>/dev/null; then ARGS="$ARGS --istanbul"; fi
          ;;
      esac

      if [ "$TIACC_VERBOSE" = "true" ]; then ARGS="$ARGS -v"; fi

      tia-mapper $ARGS
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# Recommend job - run on MRs to get affected tests
.tiacc-recommend:
  extends: .tiacc-cache
  image: node:20
  stage: .pre
  cache:
    policy: pull
  script:
    - npm install -g @tiacc/tools
    - |
      # Check if database exists
      if [ ! -f "$TIACC_DATABASE" ]; then
        echo "No TiaCC database found. Running all tests."
        echo "" > affected-tests.txt
        exit 0
      fi

      # Get affected tests
      ARGS="--db $TIACC_DATABASE"

      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        ARGS="$ARGS --base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      else
        ARGS="$ARGS --base $TIACC_BASE_BRANCH"
      fi

      if [ "$TIACC_VERBOSE" = "true" ]; then ARGS="$ARGS -v"; fi

      tia-recommend $ARGS > affected-tests.txt || true

      # Output results
      echo "=== TiaCC Test Impact Analysis ==="
      echo "Affected tests:"
      cat affected-tests.txt
      echo "=================================="

      # Set for downstream jobs
      AFFECTED_COUNT=$(wc -l < affected-tests.txt | tr -d ' ')
      echo "TIACC_AFFECTED_COUNT=$AFFECTED_COUNT" >> build.env
  artifacts:
    paths:
      - affected-tests.txt
    reports:
      dotenv: build.env
    expire_in: 1 day
  rules:
    - if: $CI_MERGE_REQUEST_ID

# Test job template - use affected tests
.tiacc-test:
  needs:
    - job: tiacc-recommend
      optional: true
  before_script:
    - |
      # Read affected tests if available
      if [ -f "affected-tests.txt" ] && [ -s "affected-tests.txt" ]; then
        export TIACC_TEST_FILTER=$(cat affected-tests.txt | tr '\n' ' ')
        echo "Running affected tests: $TIACC_TEST_FILTER"
      else
        echo "Running all tests (no TiaCC filter)"
        export TIACC_TEST_FILTER=""
      fi

# Complete workflow example
tiacc-build:
  extends: .tiacc-build

tiacc-recommend:
  extends: .tiacc-recommend

