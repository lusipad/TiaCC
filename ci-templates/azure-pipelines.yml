# TiaCC Azure Pipelines Template
# Include this in your azure-pipelines.yml to enable Test Impact Analysis
#
# Usage:
#   resources:
#     repositories:
#       - repository: tiacc
#         type: github
#         name: your-org/TiaCC
#         ref: main
#
#   stages:
#     - template: ci-templates/azure-pipelines.yml@tiacc
#       parameters:
#         coverageDir: './coverage'

parameters:
  - name: coverageDir
    type: string
    default: './coverage'
  - name: database
    type: string
    default: 'impact_map.db'
  - name: baseBranch
    type: string
    default: 'origin/main'
  - name: verbose
    type: boolean
    default: false
  - name: dotnetVersion
    type: string
    default: '8.0.x'

stages:
  - stage: TiaCC
    displayName: 'Test Impact Analysis'
    jobs:
      # Build job - updates the mapping database
      - job: Build
        displayName: 'Build TiaCC Mapping'
        condition: |
          or(
            eq(variables['Build.Reason'], 'Schedule'),
            eq(variables['Build.SourceBranch'], 'refs/heads/main')
          )
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: '${{ parameters.dotnetVersion }}'

          - task: Cache@2
            displayName: 'Cache TiaCC Database'
            inputs:
              key: 'tiacc | $(Agent.OS)'
              path: '${{ parameters.database }}'
              restoreKeys: |
                tiacc | $(Agent.OS)

          - script: dotnet build tools-dotnet -c Release
            displayName: 'Build TiaCC'

          - script: |
              dotnet run --project tools-dotnet/TiaCC.Cli -- init --db ${{ parameters.database }}

              # Map coverage files
              for coverage_file in ${{ parameters.coverageDir }}/**/coverage.cobertura.xml; do
                if [ -f "$coverage_file" ]; then
                  TEST_NAME=$(basename $(dirname "$coverage_file"))
                  echo "Mapping coverage for $TEST_NAME..."
                  dotnet run --project tools-dotnet/TiaCC.Cli -- map \
                    --db ${{ parameters.database }} \
                    --coverage "$coverage_file" \
                    --test "$TEST_NAME" || true
                fi
              done

              # Show statistics
              dotnet run --project tools-dotnet/TiaCC.Cli -- stats --db ${{ parameters.database }}
            displayName: 'Build TiaCC Mapping'

          - publish: '${{ parameters.database }}'
            artifact: 'tiacc-database'
            displayName: 'Publish Database'

      # Recommend job - identifies affected tests for PRs
      - job: Recommend
        displayName: 'Recommend Affected Tests'
        condition: eq(variables['Build.Reason'], 'PullRequest')
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: '${{ parameters.dotnetVersion }}'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download TiaCC Database'
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProjectId)'
              definition: '$(System.DefinitionId)'
              buildVersionToDownload: 'latest'
              artifactName: 'tiacc-database'
              targetPath: '$(Pipeline.Workspace)'
            continueOnError: true

          - script: |
              if [ -f "$(Pipeline.Workspace)/${{ parameters.database }}" ]; then
                cp "$(Pipeline.Workspace)/${{ parameters.database }}" .
              fi
            displayName: 'Restore Database'

          - script: dotnet build tools-dotnet -c Release
            displayName: 'Build TiaCC'

          - script: |
              if [ ! -f "${{ parameters.database }}" ]; then
                echo "No TiaCC database found. Running all tests."
                echo "" > affected-tests.txt
                exit 0
              fi

              # Get changed files
              CHANGED_FILES=$(git diff --name-only origin/$(System.PullRequest.TargetBranch))

              # Query affected tests
              dotnet run --project tools-dotnet/TiaCC.Cli -- query \
                --db ${{ parameters.database }} \
                --files $CHANGED_FILES > affected-tests.txt || true

              echo "=== TiaCC Test Impact Analysis ==="
              echo "Affected tests:"
              cat affected-tests.txt
              echo "=================================="
            displayName: 'Get Affected Tests'

          - publish: 'affected-tests.txt'
            artifact: 'tiacc-affected-tests'
            displayName: 'Publish Affected Tests'

          - script: |
              AFFECTED=$(cat affected-tests.txt | tr '\n' ',' | sed 's/,$//')
              echo "##vso[task.setvariable variable=TIACC_AFFECTED_TESTS;isOutput=true]$AFFECTED"
            name: setvar
            displayName: 'Set Output Variable'
